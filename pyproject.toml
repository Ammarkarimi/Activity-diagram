[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-diagram-multi-agent"
version = "0.1.0"
description = "Research prototype for requirement-to-UML-activity-diagram generation with multi-agent validation and repair."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
